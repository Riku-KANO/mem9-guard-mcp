[project]
name = "mem9-guard-mcp"
version = "0.1.0"
description = "MCP server that exposes mem9 agent memory behind OWASP agent-memory-guard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Riku-KANO", email = "rickwindows0127@gmail.com" }]
requires-python = ">=3.12"
keywords = ["mcp", "agent-memory", "security", "owasp", "mem9"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "agent-memory-guard>=0.3.0",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.urls]
Repository = "https://github.com/Riku-KANO/mem9-guard-mcp"
Issues = "https://github.com/Riku-KANO/mem9-guard-mcp/issues"

[project.scripts]
mem9-guard-mcp = "mem9_guard_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mem9_guard_mcp"]
